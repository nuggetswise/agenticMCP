/* TG for Retail Product UI shell. Values from the OpenText TG Retail Design System: project/tokens.css, tokens.json
   (action-soft, accent-soft) and project/components/bundle.css. No green tokens. */
:root{
  --ot-blue-900:#00008a; --ot-blue-500:#1968ff; --ot-navy-900:#001c50; --ot-gold-400:#e1bb35;
  --ot-grad-from:#00008b; --ot-grad-to:#1a6aff; --ot-ink-900:#0f1b2d; --ot-ink-800:#1a2332;
  --ot-slate-700:#373848; --ot-slate-500:#66677b; --ot-slate-400:#8a92a0; --ot-line-200:#e7e9ec;
  --ot-surface-100:#fbfbfc; --ot-surface-50:#f4f6f5; --ot-white:#ffffff;
  --ot-warn:#8a6d1f; --ot-warn-bar:#e6c766; --ot-warn-tint:#fbefd0;
  --ot-risk:#c0392b; --ot-risk-bar:#e4a9a9; --ot-risk-tint:#fbeaea;
  --color-primary:var(--ot-blue-900); --color-action:var(--ot-blue-500); --action-text:#1163ff;
  --color-accent:var(--ot-gold-400); --text-heading:var(--ot-ink-900); --text-body:var(--ot-slate-700);
  --text-muted:var(--ot-slate-500); --text-on-dark:var(--ot-white); --link:var(--action-text); --link-hover:var(--ot-blue-900);
  --surface-page:var(--ot-surface-50); --surface-card:var(--ot-white); --surface-subtle:var(--ot-surface-100);
  --surface-dark:var(--ot-navy-900); --border-default:var(--ot-line-200); --border-strong:#d3d7dd;
  --action-soft:#e8f0ff; --accent-soft:#faf1d2;
  --shadow-xs:0 1px 2px rgba(15,27,45,.05); --shadow-sm:0 1px 3px rgba(15,27,45,.08);
  --shadow-md:0 4px 12px rgba(15,27,45,.08); --shadow-lg:0 12px 32px rgba(15,27,45,.12);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:12px; --radius-xl:16px; --radius-pill:999px;
  --font-sans:Inter,"Helvetica Neue",Arial,sans-serif;
  --mono-ui:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ui-fs-title:22px; --ui-fs-card-title:14px; --ui-fs-body:13px; --ui-fs-body-lg:14px; --ui-fs-small:12px; --ui-fs-label:10.5px;
  --ui-fw-medium:500; --ui-fw-semibold:600;
  --ui-dur-fast:150ms; --ui-dur-enter:260ms; --ui-dur-fold:460ms; --ui-dur-settle:600ms; --ui-stagger:30ms;
  --ui-ease:cubic-bezier(0.23,1,0.32,1); --ui-ease-travel:cubic-bezier(0.45,0,0.2,1);
  --ui-press-scale:0.97; --ui-enter-scale:0.98; --ui-disabled-opacity:0.45;
  --ui-shell-gutter:24px; --ui-list-pane:400px; --ui-work-start:200px;
  --ls-eyebrow:0.08em;
  --grad-brand:linear-gradient(135deg,var(--ot-grad-from) 0%,var(--ot-grad-to) 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);font-size:var(--ui-fs-body);line-height:var(--lh-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.mono{font-family:var(--mono-ui);font-size:var(--ui-fs-small);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--color-action);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh}
/* top bar */
.top{flex:none;display:flex;align-items:center;gap:var(--space-4);height:52px;padding:0 var(--ui-shell-gutter);background:var(--surface-card);border-bottom:1px solid var(--border-default)}
.mark{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--ui-fw-bold);color:var(--text-heading);font-size:var(--ui-fs-body-lg);white-space:nowrap}
.mark i{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--grad-brand);display:inline-block}
.ws{color:var(--text-muted);font-size:var(--ui-fs-small);border-left:1px solid var(--border-default);padding-left:var(--space-4);white-space:nowrap}
.top .sp{flex:1}
.clock{white-space:nowrap;font-weight:var(--ui-fw-semibold);color:var(--text-heading)}
.tb{border:1px solid var(--border-strong);background:var(--surface-card);border-radius:var(--radius-md);height:32px;padding:0 var(--space-3);cursor:pointer;font-size:var(--ui-fs-small);font-weight:var(--ui-fw-medium);color:var(--text-heading);white-space:nowrap;transition:background var(--ui-dur-fast) var(--ui-ease)}
.tb:hover{background:var(--surface-subtle)}
.acct{position:relative}
.acct>button{display:inline-flex;align-items:center;gap:var(--space-2)}
.acct .av{width:22px;height:22px;border-radius:var(--radius-pill);background:var(--action-soft);color:var(--action-text);display:inline-flex;align-items:center;justify-content:center;font-size:var(--ui-fs-label);font-weight:var(--ui-fw-bold)}
.acct .caret{width:8px;height:8px;border-right:1.5px solid var(--text-muted);border-bottom:1.5px solid var(--text-muted);transform:rotate(45deg) translateY(-2px)}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:260px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:var(--space-1);z-index:30;opacity:0;transform:translateY(-4px) scale(var(--ui-enter-scale));pointer-events:none;transition:opacity var(--ui-dur-fast) var(--ui-ease),transform var(--ui-dur-fast) var(--ui-ease)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu .ml{padding:var(--space-2) var(--space-3) var(--space-1);font-size:var(--ui-fs-label);font-weight:var(--ui-fw-semibold);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);cursor:pointer}
.menu button:hover{background:var(--surface-subtle)}
.menu button[aria-checked="true"]{background:var(--action-soft)}
.menu button b{font-weight:var(--ui-fw-semibold);color:var(--text-heading)}
.menu button span{font-size:var(--ui-fs-small);color:var(--text-muted)}
/* page head */
/* Figure size for headline tiles: proposed for the design system's Product UI scale. */
:root{--ui-fs-stat:calc(var(--ui-fs-title) * 1.2);--ui-fw-bold:700;--lh-tight:1.1;--fw-regular:400;--lh-body:1.5;--lh-heading:1.2}
.head{flex:none;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-1) var(--ui-shell-gutter)}
.hrow{display:flex;gap:var(--space-4);align-items:center;justify-content:space-between}
.per{display:inline-flex;flex:none;border:1px solid var(--border-default);border-radius:var(--radius-pill);background:var(--surface-page);padding:0}
.per button{border:0;background:none;font:inherit;font-size:var(--ui-fs-small);font-weight:var(--ui-fw-medium);color:var(--text-muted);line-height:var(--space-6);padding:0 var(--space-3);border-radius:var(--radius-pill);cursor:pointer}
.per button[aria-pressed="true"]{background:var(--surface-card);box-shadow:var(--shadow-xs);color:var(--ot-blue-900)}
.per:empty{display:none}
.head h1{margin:0;font-size:var(--ui-fs-title);font-weight:var(--ui-fw-bold);line-height:var(--lh-heading);color:var(--text-heading)}
.ev{margin:0;color:var(--text-body)}
.goal{color:var(--text-muted)}
.figs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--space-3)}
.fig{border:1px solid var(--border-default);background:var(--surface-card);border-radius:var(--radius-lg);padding:var(--space-2) var(--space-4);display:flex;flex-direction:column;align-items:flex-start;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background var(--ui-dur-fast) var(--ui-ease),box-shadow var(--ui-dur-fast) var(--ui-ease)}
.fig:hover{background:var(--action-soft)}
.fig[aria-pressed="true"]{background:var(--action-soft);box-shadow:inset 0 0 0 2px var(--color-action)}
.fig span{font-size:var(--ui-fs-small);font-weight:var(--ui-fw-medium);color:var(--text-muted);white-space:nowrap}
.fig b{font-size:var(--ui-fs-stat);line-height:var(--lh-tight);font-weight:var(--ui-fw-bold);color:var(--text-heading);font-variant-numeric:tabular-nums}
.fig em{font-style:normal;font-size:var(--ui-fs-small);color:var(--text-muted)}
.fig.risk b{color:var(--ot-risk)}
.fig.warn b{color:var(--ot-warn)}
.glb{width:100%;border:0;background:none;cursor:pointer;font-family:inherit;text-align:left}
.glb:hover{background:var(--surface-subtle)}
.glb i{font-style:normal;color:var(--action-text);letter-spacing:0;text-transform:none;font-weight:var(--ui-fw-medium);margin-left:auto;padding-left:var(--space-2)}
.more{margin-top:var(--space-2)}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,4fr) minmax(0,1fr);gap:var(--space-3);align-items:center;width:100%;border:0;border-bottom:1px solid var(--border-default);background:none;font:inherit;color:inherit;text-align:left;padding:var(--space-2) var(--space-1);cursor:pointer}
.sbar:hover{background:var(--action-soft)}
.sbar .tr{height:6px;border-radius:var(--radius-pill);background:var(--border-default);overflow:hidden}
.sbar .tr i{display:block;height:100%;background:var(--color-action);border-radius:var(--radius-pill)}
.sbar .nm{font-weight:var(--ui-fw-semibold);color:var(--text-heading)}
.sbar .vv{text-align:right;font-variant-numeric:tabular-nums}
.sbar .vv em{display:block;font-style:normal;font-size:var(--ui-fs-small);color:var(--text-muted)}
.dc.capped tbody tr:nth-child(n+6){display:none}
.drawer.wide{width:min(980px,94vw)}
.hi .tag{white-space:normal;text-align:left}
/* list and detail */
.split{flex:1;min-height:0;display:grid;grid-template-columns:var(--ui-list-pane) minmax(0,1fr);gap:var(--ui-shell-gutter);padding:0 var(--ui-shell-gutter) var(--ui-shell-gutter)}
.pane{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tool{flex:none;display:flex;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-default)}
.tool input{flex:1;min-width:0;height:30px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 var(--space-2);font-size:var(--ui-fs-small);background:var(--surface-card)}
.tool .sort{font-size:var(--ui-fs-small);color:var(--text-muted);white-space:nowrap}
.list{flex:1;overflow:auto}
.bulk{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-default);background:var(--action-soft);font-size:var(--ui-fs-small);color:var(--text-heading)}

<script>
/* TG for Retail prototype shell: top bar with account menu, list and detail split, drawer, History, Rules and Aviator.
   Data is built into the page; no network call except Aviator's on the hosted copy. */
(function(){
"use strict";
const E = window.E = {};
const $ = E.$ = s => document.querySelector(s);
const esc = E.esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
E.RM = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
E.money = n => (n < 0 ? "−$" : "$") + Math.abs(Number(n)).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
E.int = n => Number(n).toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");
E.hm = t => { const d = ((t % 1440) + 1440) % 1440; return pad(Math.floor(d / 60)) + ":" + pad(d % 60); };
E.day = t => Math.floor(t / 1440);
E.when = t => E.cfg.days[(((E.day(t)) % 7) + 7) % 7] + " " + E.hm(t);
E.wait = ms => new Promise(r => setTimeout(r, E.RM() ? 0 : ms));
const S = E.S = {side:null, clock:0, sel:{}, open:{}, busy:false, pending:{}, hist:[], q:"", started:false, seen:{}};

E.init = function(cfg){
  E.cfg = cfg; S.clock = cfg.start; S.side = cfg.sides[0].id;
  document.title = cfg.docTitle;
  const multi = cfg.sides.length > 1;
  document.body.insertAdjacentHTML("afterbegin", `
